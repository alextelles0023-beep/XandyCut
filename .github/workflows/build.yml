name: Gerar APK Xandy Cut
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK necessario
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extrair codigo do projeto
        run: |
          base64 -d xandycut-source.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/art/xandy/cut/MainActivity.java
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK para instalar
        uses: actions/upload-artifact@v4
        with:
          name: XandyCut-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
