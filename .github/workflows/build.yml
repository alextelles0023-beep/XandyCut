name: Gerar APK Xandy Cut
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK necessario
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extrair codigo do projeto
        run: |
          base64 -d xandycut-source.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/art/xandy/cut/MainActivity.java
          cp MainActivityV4.java app/src/main/java/art/xandy/cut/MainActivity.java
          sed -i 's/android:label="Xandy Cut"/android:label="Xandy Cut 1.3"/' app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' app/src/main/AndroidManifest.xml
          sed -i '/dependencies {/a\    implementation "androidx.media3:media3-effect:1.11.1"' app/build.gradle
          sed -i "s/applicationId 'art.xandy.cut'/applicationId 'art.xandy.cut.editor13'/; s/versionCode 1/versionCode 4/; s/versionName '1.0'/versionName '1.3'/" app/build.gradle
      - name: Produzir biblioteca integrada de audios originais
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q numpy
          python3 generate_original_audio.py
          test -s app/src/main/assets/audio/cinema.m4a
          test -s online_audio/aventura.m4a
          test -s online_audio/diaalegre.m4a
          test -s online_audio/sinoceleste.m4a
          test "$(find online_audio -name '*.m4a' | wc -l)" -ge 29
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK para instalar
        uses: actions/upload-artifact@v4
        with:
          name: XandyCut-1.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Criar link direto para instalar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk XandyCut-v1.3-beta.apk
          gh release view v1.3-beta >/dev/null 2>&1 || gh release create v1.3-beta --target "${GITHUB_SHA}" --title "Xandy Cut 1.3 beta" --notes "Editor vertical 1080x1920, transicoes com duracao configuravel, volume por clipe, forma de onda real de audio, trilhas por intervalos de cenas e catalogo de 29 audios online originais. Sem anuncios e sem marca d'agua. Android 10+." --prerelease
          gh release upload v1.3-beta XandyCut-v1.3-beta.apk online_audio/*.m4a --clobber
