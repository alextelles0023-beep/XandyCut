name: Gerar APK Xandy Cut
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK necessario
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extrair codigo do projeto
        run: |
          base64 -d xandycut-source.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/art/xandy/cut/MainActivity.java
          cp MainActivityV2.java app/src/main/java/art/xandy/cut/MainActivity.java
          sed -i "s/applicationId 'art.xandy.cut'/applicationId 'art.xandy.cut.studio'/; s/versionCode 1/versionCode 2/; s/versionName '1.0'/versionName '1.1'/" app/build.gradle
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK para instalar
        uses: actions/upload-artifact@v4
        with:
          name: XandyCut-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Criar link direto para instalar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk XandyCut-v1.1-beta.apk
          gh release view v1.1-beta >/dev/null 2>&1 || gh release create v1.1-beta --target "${GITHUB_SHA}" --title "Xandy Cut 1.1 beta" --notes "Editor Android com linha do tempo, miniaturas de clipes, cortes e ate seis faixas de audio com posicao, volume e repeticao. APK beta de teste. Requer Android 10 ou posterior." --prerelease
          gh release upload v1.1-beta XandyCut-v1.1-beta.apk --clobber
